<!DOCTYPE html>
<html>
<head>
    <title>Job Tracker</title>

    <style>
        body {
            font-family: Arial;
            background: #f4f6f8;
        }

        .container {
            width: 500px;
            margin: auto;
            margin-top: 30px;
            background: white;
            padding: 20px;
            border-radius: 10px;
        }

        input, select, textarea {
            width: 100%;
            padding: 10px;
            margin-top: 10px;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 10px;
            margin-top: 10px;
            background: blue;
            color: white;
            border: none;
            cursor: pointer;
        }

        button:hover {
            background: darkblue;
        }

        /* 🔥 JOB LIST SCROLL */
        #jobList {
            max-height: 250px;
            overflow-y: auto;
            padding: 0;
        }

        li {
            list-style: none;
            margin-top: 10px;
            padding: 10px;
            color: white;
            border-radius: 5px;
        }

        .applied {
            background: blue;
        }

        .interview {
            background: green;
        }

        .rejected {
            background: red;
        }

        .result {
            margin-top: 15px;
            padding: 10px;
            background: #eee;
            border-radius: 5px;
        }
    </style>
</head>

<body>

<div class="container">

<h2>Job Tracker</h2>

<input type="text" id="company" placeholder="Company">
<input type="text" id="role" placeholder="Role">

<select id="status">
    <option value="">Select Status</option>
    <option value="Applied">Applied</option>
    <option value="Interview">Interview</option>
    <option value="Rejected">Rejected</option>
</select>

<button onclick="addJob()">Add Job</button>

<button onclick="getJobs()">Load Jobs</button>

<ul id="jobList"></ul>

<hr>

<h3>Skill Match Analyzer</h3>

<input type="file" id="resumeFile">

<textarea id="jobdesc" placeholder="Paste Job Description"></textarea>

<button onclick="analyze()">Analyze</button>

<div id="result" class="result"></div>

</div>

<script>

function addJob() {

    let company = document.getElementById('company').value.trim();
    let role = document.getElementById('role').value.trim();
    let status = document.getElementById('status').value;

    if (!company || !role || !status) {
        alert("Fill all fields");
        return;
    }

    fetch('http://127.0.0.1:5000/add-job', {

        method: 'POST',

        headers: {
            'Content-Type': 'application/json'
        },

        body: JSON.stringify({
            company: company,
            role: role,
            status: status
        })

    })

    .then(res => res.json())

    .then(data => {

        alert(data.message);

        // 🔥 CLEAR INPUTS
        document.getElementById('company').value = "";
        document.getElementById('role').value = "";
        document.getElementById('status').value = "";

        // 🔥 AUTO REFRESH JOB LIST
        getJobs();

    })

    .catch(err => console.log(err));
}

function getJobs() {

    fetch('http://127.0.0.1:5000/get-jobs')

    .then(res => res.json())

    .then(data => {

        let jobList = document.getElementById('jobList');

        jobList.innerHTML = "";

        if (data.length === 0) {

            jobList.innerHTML = "<li style='color:black'>No jobs added</li>";
            return;
        }

        data.forEach(job => {

            let li = document.createElement('li');

            if (job.status === "Applied")
                li.className = "applied";

            else if (job.status === "Interview")
                li.className = "interview";

            else
                li.className = "rejected";

            li.innerText =
                job.company + " - " +
                job.role + " (" +
                job.status + ")";

            jobList.appendChild(li);

        });

    })

    .catch(err => console.log(err));
}

function analyze() {

    let file = document.getElementById("resumeFile").files[0];

    if (!file) {
        alert("Upload resume file");
        return;
    }

    let reader = new FileReader();

    reader.onload = function(e) {

        let resumeText = e.target.result;

        fetch('http://127.0.0.1:5000/analyze', {

            method: 'POST',

            headers: {
                'Content-Type': 'application/json'
            },

            body: JSON.stringify({
                resume: resumeText,
                job_desc: document.getElementById('jobdesc').value
            })

        })

        .then(res => res.json())

        .then(data => {

            // 🔥 HANDLE EMPTY MISSING
            let missingSkills =
                data.missing.length > 0
                ? data.missing.join(", ")
                : "None";

            document.getElementById('result').innerHTML =
                "<b>Match:</b> " + data.match + "%<br><br>" +
                "<b>Missing Skills:</b> " + missingSkills;

        });

    };

    reader.readAsText(file);
}

</script>

</body>
</html>
